<!DOCTYPE html>
<html>
    <head>
        <title>Alignment Notes</title>
        <meta charset="UTF-8">
        <style>
            button{
                padding:20px;
                margin-left:45%;
            }
            #box, #box2{
                width:75px;
                height:75px;
                background-color:darkslategrey;
                color:azure;
                text-align:center;
            }
            #box-wrapper{
                display:grid;
                grid-template-columns: 1fr 200px 1fr;
                gap: 5px;
            }
            #flex-wrapper{
                display: none;
                display:flex;
                flex-direction: row;
                justify-content:space-between;
                flex-wrap: wrap;
            }
            #showMore{

            }
            #duck{
                width:150px;
            }
        </style>
    </head>
    <body>
        <h1>Alignment Notes</h1>
        <img src="https://irp.cdn-website.com/2740280e/dms3rep/multi/opt/Auggie-2a12d0bb-640w.jpg" alt="duck" id="duck" onmouseout="changeImage()">
        <div id="box-wrapper">
            <div id="box" onmouseover="disappear()" onmouseout="appear()">
                <p>Box 1</p>
            </div>
            <div id="box2">
                <p>Box 2</p>
            </div>
            <div id="box">
                <p>Box 3</p>
            </div>
            <div id="box">
                <p>Box 4</p>
            </div>
        </div>
        <div id="flex-wrapper">
            <div id="box">
                <p>Box 1</p>
            </div>
            <div id="box">
                <p>Box 2</p>
            </div>
            <div id="box">
                <p>Box 3</p>
            </div>
            <div id="box">
                <p>Box 4</p>
            </div>
        </div>
        <input type="color" id="colorPicker">
        <br>
            <button onClick="color()">Click me</button>
            <button id="showMore" onClick="show()">Show More</button>
            <script>
                //makes the webpage interactive
                let images = ["https://irp.cdn-website.com/2740280e/dms3rep/multi/opt/Auggie-2a12d0bb-640w.jpg", "https://www.metzerfarms.com/images/products/jumbo-pekin-ducks/jumbo-main.jpg", "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRxRsMmFBgZHVt5sRdJIxdfrAeCogE_fLjLelO-iP_BDA&s=10", "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTqylkyC18q3jK1DKAF81nIXDG3IKlgzWZEFnM0eKDGoqi4ZXpYrNo3sLQ&s=10"]
                let current = 0
                function changeImage(){
                    current += 1;
                    if (current > 3){
                        current = 0;
                    }
                    document.getElementById("duck").src = images[current]
                }
                function color(){
                    let newColor = document.getElementById("colorPicker").value
                    document.getElementById("box").style.backgroundColor = newColor
                }
                function disappear(){
                    document.getElementById("box2").style.display = 'none'
                }
                function appear(){
                    document.getElementById("box2").style.display = 'block'
                }
                function show(){
                    let element = document.getElementById("flex-wrapper")
                    if (element.style.display == "flex"){
                        element.style.display = "none"
                        document.getElementById("showMore").innerHTML = "show More"
                    }else{
                        element.style.display = "flex"
                        document.getElementById("showMore").innerHTML = "Show Less"
                    }
                }
            </script>
    </body>
</html>
