<!DOCTYPE html>
<html> <!--an element -->
    <head> <!--holds the needed info that the user doesn't see-->
        <title>Basic Starter</title>
        <meta charset="UTF-8">
    </head>
    <body> <!--The stuff the user sees-->
        <h1>Basic Starter Page</h1> <!--Largest heading-->
        <p>This is a basic paragraph. This is used to write the bulk of what is on your webpage.</p> <!--Smallest text-->
        <h2>This is a subheader.</h2>
        <p>Paragraphs get put on their own line, <br>just like starting a new paragraph in english.</p>
    </body>
</html>
