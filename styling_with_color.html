<!--JR, 6th, CSS Styling with Color-->

<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Styling with Color</title>
        <meta charset="UTF-8">
        <style>
            h1{
                text-align:center;
                color:cornflowerblue;
                font-size:50px;
            }
            h3{
                text-align:center;
                color: rgb(255, 255, 255);
            }
            #comp{
                background-color: rgb(0, 0, 255);
                height: 200px;
                width: 200px;
                border: solid 10px;
                border-color: rgb(255, 166, 0);
            }
            #ana{
                background-color: purple;
                height: 200px;
                width: 200px;
                border: solid 10px;
                border-color: rgb(68, 0, 255);
            }
            #triad{
                background-color: rgb(255, 0, 0);
                height: 200px;
                width: 200px;
                border: solid 10px;
                border-color: rgb(255, 255, 0);
            }
            #word{
                color:blue;
            }
        </style>
    </head>
    <body>
        <h1>Color Theory Examples</h1>
        <div id="comp">
            <h3>Complementary</h3>
        </div>
        <p><br></p>
        <div id="ana">
            <h3>Analogous</h3>
        </div>
        <p><br></p>
        <div id="triad">
            <h3 id="word">Triadic</h3>
        </div>
    </body>
</html>
